name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" pytest

  quality:
    name: Quality and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.12
      - name: Run strict type checks
        run: uv run mypy --strict src
      - name: Run Ruff
        run: uv run ruff check .
      - name: Validate skill and release metadata
        run: uv run python scripts/check_release.py metadata
      - name: Check local Markdown links
        run: uv run python scripts/check_release.py links
      - name: Build release archives
        run: uv build
      - name: Inspect release archive allowlists
        run: uv run python scripts/check_release.py archives

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan the full branch
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.97.0
        with:
          base: ""
          head: ${{ github.sha }}
          version: "3.97.0"
          extra_args: --results=verified,unknown
