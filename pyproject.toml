[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "things-orchestrator"
version = "0.4.7"
description = "Unofficial self-hosted Things 3 Cloud MCP with three tools"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mats Varnskuhler" }]
keywords = ["mcp", "model-context-protocol", "things3", "things-cloud", "hermes", "gtd", "unofficial", "self-hosted"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
]
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp==2.0.0",
  "pydantic==2.13.4",
]

[project.scripts]
things-orchestrator = "things_orchestrator.cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "PyYAML==6.0.3",
  "ruff==0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/things_orchestrator"]

[tool.hatch.build.targets.sdist]
only-include = [
  "LICENSE",
  "README.md",
  "pyproject.toml",
  "src/things_orchestrator",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
